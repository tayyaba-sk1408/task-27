
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Condition Selector</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="weather-container" id="weatherCard">
        <div class="top-label">WEATHER EXPLORER</div>
        <h1>Weather Today</h1>
        <p class="subtitle">Choose a condition to explore the weather.</p>

        <label for="weatherSelect">Select Weather Condition</label>
        <select id="weatherSelect">
            <option value="default">Choose a condition</option>
            <option value="sunny">Sunny</option>
            <option value="cloudy">Cloudy</option>
            <option value="rainy">Rainy</option>
            <option value="stormy">Stormy</option>
            <option value="snowy">Snowy</option>
            <option value="windy">Windy</option>
            <option value="foggy">Foggy</option>
        </select>

        <section class="weather-display" aria-live="polite">
            <div class="weather-icon" id="weatherIcon">🌤️</div>
            <h2 id="weatherTitle">Welcome!</h2>
            <p id="weatherDescription">Select a weather condition to see its description.</p>
        </section>

        <p class="footer">A simple weather experience made with HTML, CSS & JavaScript</p>
    </main>
</body>
</html>
